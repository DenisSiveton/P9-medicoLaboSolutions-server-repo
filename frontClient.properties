server.port = 8080

management.endpoints.web.exposure.include=*

################### DataSource Configuration ##########################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DOCKER_MYSQL_HOSTNAME:localhost}:${DOCKER_MYSQL_PORT:3306}/medicolabosolutions?serverTimezone=UTC
spring.datasource.username=${DOCKER_MYSQL_USER:root}
spring.datasource.password=${DOCKER_MYSQL_PASSWORD:firebendinG31!}

################### Hibernate Configuration ##########################
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization = true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.mode = never

################### Proxies Configuration ##########################

proxy.patient.name = ${DOCKER_SPRING_CLOUD_HOSTNAME:localhost}

# Eureka Configuration
eureka.client.serviceUrl.defaultZone = http://${DOCKER_EUREKA_HOSTNAME:localhost}:9102/eureka/