server.port = 9001

################### DataSource Configuration ##########################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DOCKER_MYSQL_HOSTNAME:localhost}:${DOCKER_MYSQL_PORT:3306}/medicolabosolutions?serverTimezone=UTC
spring.datasource.username=${DOCKER_MYSQL_USER:root}
spring.datasource.password=${DOCKER_MYSQL_PASSWORD:firebendinG31!}
#spring.datasource.url=jdbc:mysql://localhost:3306/medicolabosolutions?serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=firebendinG31!

################### Hibernate Configuration ##########################
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization = true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.mode = never

# Eureka Configuration
eureka.client.serviceUrl.defaultZone = http://${DOCKER_EUREKA_HOSTNAME:localhost}:9102/eureka/
#eureka.client.serviceUrl.defaultZone = http://eureka-server:9102/eureka/